name: Prime Physio database integrity

on:
  push:
    branches: [security/independent-view-permissions]
  pull_request:
    branches: [main]
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prime-physio-database-integrity
  cancel-in-progress: false

jobs:
  read-only-integrity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_READONLY_DB_URL: ${{ secrets.SUPABASE_READONLY_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Run read-only integrity checks
        if: ${{ env.SUPABASE_READONLY_DB_URL != '' }}
        run: node scripts/check-db-integrity.mjs

      - name: Report integrity audit as skipped when read-only credentials are unavailable
        if: ${{ env.SUPABASE_READONLY_DB_URL == '' }}
        run: echo "::notice::SKIPPED — SUPABASE_READONLY_DB_URL is not configured; no database integrity query was run."
