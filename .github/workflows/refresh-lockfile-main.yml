name: Refresh npm lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prime-physio-main-lockfile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile without lifecycle scripts
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Verify clean dependency installation
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches package.json."
            exit 0
          fi
          git commit -m "chore: align npm lockfile with package manifest"
          git push origin HEAD:main
