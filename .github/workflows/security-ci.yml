name: Security and application checks

on:
  push:
    branches: [main, security/critical-hardening, security/phase-3-csp-nonce]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prime-physio-security-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      NEXTAUTH_SECRET: ci-only-secret-with-more-than-32-characters
      NEXTAUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-placeholder-google-client-id
      GOOGLE_CLIENT_SECRET: ci-placeholder-google-client-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Audit production dependencies
        id: dependency_audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Enforce nonce-only CSP styles
        run: |
          grep -q "style-src-attr 'none'" src/proxy.ts
          grep -q "style-src-elem" src/proxy.ts
          if grep -n "unsafe-inline" src/proxy.ts; then
            echo "::error::unsafe-inline must not be present in the CSP."
            exit 1
          fi
          if grep -RInE 'style[[:space:]]*=|<style([[:space:]>])' src --include='*.tsx' --include='*.jsx' --include='*.ts' --include='*.js' --exclude='email.ts'; then
            echo "::error::Inline style attributes/elements must be migrated to CSS (email HTML is intentionally excluded because it is delivered outside the app CSP)."
            exit 1
          fi
          if grep -RInE 'framer-motion|motion/react|<motion\\.' src --include='*.tsx' --include='*.jsx' --include='*.ts' --include='*.js'; then
            echo "::error::Motion libraries can emit inline styles and are not allowed under style-src-attr 'none'."
            exit 1
          fi

      - name: Production build
        run: npm run build

      - name: Preserve audit failure after running all checks
        if: always() && steps.dependency_audit.outcome == 'failure'
        run: |
          echo "::error::High or critical production dependency vulnerabilities remain."
          exit 1
