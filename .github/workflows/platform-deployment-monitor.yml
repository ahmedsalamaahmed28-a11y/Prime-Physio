name: Prime Physio deployment monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Security and application checks"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: prime-physio-deployment-monitor
  cancel-in-progress: true

jobs:
  verify-vercel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify Vercel production deployment for the latest main commit
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = await github.rest.repos.getBranch({ owner, repo, branch: "main" });
            const sha = branch.data.commit.sha;

            const shortSha = sha.slice(0, 7);
            const issueTitle = `[Automation] Vercel deployment failed for ${shortSha}`;
            let clinic = null;
            let control = null;

            const isTerminal = (status) =>
              status && ["success", "failure", "error"].includes(status.state);

            for (let attempt = 0; attempt < 20; attempt += 1) {
              const response = await github.rest.repos.listCommitStatusesForRef({
                owner,
                repo,
                ref: sha,
                per_page: 100,
              });
              const statuses = response.data.filter((item) =>
                item.context?.toLowerCase().startsWith("vercel")
              );

              // Vercel publishes one status per connected project, not a single
              // status named exactly "Vercel". Track both production apps.
              clinic = statuses.find((item) => {
                const context = item.context.toLowerCase().replace(/\s+/g, "");
                return context.includes("prime-physio") && !context.includes("control");
              }) || null;
              control = statuses.find((item) =>
                item.context.toLowerCase().replace(/\s+/g, "").includes("primephysio-control")
              ) || null;

              if (isTerminal(clinic) && isTerminal(control)) break;
              if (attempt < 19) await new Promise((resolve) => setTimeout(resolve, 30000));
            }

            const deploymentResults = [
              { name: "Clinic application", status: clinic, target: clinic?.target_url },
              { name: "Platform control center", status: control, target: control?.target_url },
            ];
            const allSucceeded = deploymentResults.every((item) => item.status?.state === "success");
            const deploymentSummary = deploymentResults
              .map((item) => `- ${item.name}: **${item.status?.state || "no status received"}** — ${item.target || "No deployment URL reported"}`)
              .join("\n");

            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.data.find((issue) => issue.title === issueTitle);

            if (allSucceeded) {
              const staleIssues = issues.data.filter((issue) =>
                issue.title.startsWith("[Automation] Vercel deployment failed for ")
              );
              for (const staleIssue of staleIssues) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: staleIssue.number,
                  state: "closed",
                  state_reason: "completed",
                });
              }
              core.info(`Both Vercel production deployments succeeded for ${shortSha}.\n${deploymentSummary}`);
              return;
            }

            const state = deploymentResults
              .map((item) => `${item.name}: ${item.status?.state || "missing"}`)
              .join("; ");
            const target = deploymentSummary;
            const body = [
              "## Automated deployment monitor",
              "",
              `- Commit: \`${sha}\``,
              `- Vercel statuses:\n${deploymentSummary}`,
              `- Workflow: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              `- Deployment details: ${target}`,
              "",
              "This issue was opened automatically. No application files or database records were changed.",
              "Review the Vercel build/runtime logs, fix the cause, and push a verified commit to `main`.",
            ].join("\n");

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Monitor recheck: Vercel status is now **${state}**.\n\n${target}`,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: issueTitle,
                body,
              });
            }

            core.setFailed(`Vercel deployment for ${shortSha}: ${state}`);
