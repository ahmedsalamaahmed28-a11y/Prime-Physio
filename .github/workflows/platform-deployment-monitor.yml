name: Prime Physio deployment monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Security and application checks"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: prime-physio-deployment-monitor
  cancel-in-progress: true

jobs:
  verify-vercel:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify Vercel production deployment for the latest main commit
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            let sha;

            if (context.eventName === "workflow_run") {
              sha = context.payload.workflow_run.head_sha;
            } else {
              const branch = await github.rest.repos.getBranch({ owner, repo, branch: "main" });
              sha = branch.data.commit.sha;
            }

            const shortSha = sha.slice(0, 7);
            const issueTitle = `[Automation] Vercel deployment failed for ${shortSha}`;
            let vercel = null;

            for (let attempt = 0; attempt < 20; attempt += 1) {
              const response = await github.rest.repos.listCommitStatusesForRef({
                owner,
                repo,
                ref: sha,
                per_page: 100,
              });
              vercel = response.data.find((item) => item.context?.toLowerCase() === "vercel") || null;

              if (vercel && ["success", "failure", "error"].includes(vercel.state)) break;
              if (attempt < 19) await new Promise((resolve) => setTimeout(resolve, 30000));
            }

            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.data.find((issue) => issue.title === issueTitle);

            if (vercel?.state === "success") {
              if (existing) {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: "closed",
                  state_reason: "completed",
                });
              }
              core.info(`Vercel production deployment succeeded for ${shortSha}.`);
              if (vercel.target_url) core.info(vercel.target_url);
              return;
            }

            const state = vercel?.state || "no Vercel status received within 10 minutes";
            const target = vercel?.target_url || "No deployment URL was reported by GitHub.";
            const body = [
              "## Automated deployment monitor",
              "",
              `- Commit: \`${sha}\``,
              `- Vercel status: **${state}**`,
              `- Workflow: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              `- Deployment details: ${target}`,
              "",
              "This issue was opened automatically. No application files or database records were changed.",
              "Review the Vercel build/runtime logs, fix the cause, and push a verified commit to `main`.",
            ].join("\n");

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Monitor recheck: Vercel status is now **${state}**.\n\n${target}`,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: issueTitle,
                body,
              });
            }

            core.setFailed(`Vercel deployment for ${shortSha}: ${state}`);
