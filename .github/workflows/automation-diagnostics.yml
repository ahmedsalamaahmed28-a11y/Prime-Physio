name: Prime Physio automation diagnostics

on:
  workflow_run:
    workflows:
      - "Security and application checks"
      - "Prime Physio deployment monitor"
      - "Prime Physio tenant isolation tests"
      - "Prime Physio database integrity"
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report-failure:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    steps:
      - name: Create a diagnostic issue with failed jobs and steps
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
            });

            const failedJobs = jobsResponse.data.jobs.filter((job) =>
              ["failure", "timed_out", "cancelled"].includes(job.conclusion)
            );

            const details = failedJobs.length
              ? failedJobs.map((job) => {
                  const failedSteps = (job.steps || [])
                    .filter((step) => ["failure", "timed_out"].includes(step.conclusion))
                    .map((step) => `  - ${step.name}: ${step.conclusion}`);
                  return [
                    `### ${job.name} — ${job.conclusion}`,
                    `- Job log: ${job.html_url}`,
                    ...(failedSteps.length ? failedSteps : ["  - Open the job log to identify the failing step."]),
                  ].join("\n");
                }).join("\n\n")
              : "GitHub did not return failed job details. Open the workflow run for the full result.";

            const title = `[Automation diagnosis] ${run.name} failed — run ${run.id}`;
            const body = [
              "## Automated failure summary",
              "",
              `- Workflow: ${run.name}`,
              `- Branch: ${run.head_branch}`,
              `- Commit: \`${run.head_sha}\``,
              `- Run: ${run.html_url}`,
              "",
              details,
              "",
              "## Safe next steps",
              "1. Open the failed job log and inspect the first failing step.",
              "2. Reproduce the issue in a test environment.",
              "3. Prepare a reviewed fix; do not change production patient data or database permissions automatically.",
              "",
              "This assistant only summarizes GitHub job metadata. It does not read secrets, download raw logs, edit code, or deploy fixes.",
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            if (!existing.data.some((issue) => issue.title === title)) {
              await github.rest.issues.create({ owner, repo, title, body });
            }
